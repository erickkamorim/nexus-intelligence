name: Capturas de tela (temporário)
on:
  push:
    branches: [capturas]
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]" playwright pandas && python -m playwright install --with-deps chromium
      - run: mkdir -p capturas/out && python capturas/preparar.py | tee capturas/out/resultado.txt
      - run: |
          (cd teste_site && python -m http.server 8000 &) && sleep 2
          python capturas/capturar.py | tee -a capturas/out/resultado.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add capturas/out
          git commit -m "Resultado"
          git push origin capturas
