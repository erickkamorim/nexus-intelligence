name: Capturas de tela (temporário)
on:
  push:
    branches: [capturas]
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p capturas/out && python capturas/capturar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add capturas/out
          git commit -m "Capturas geradas"
          git push origin capturas
