# Atualiza os dados, gera as previsões do dia e publica o dashboard no GitHub Pages.
#
# Quando roda: todo dia útil às 19h (Brasília), a cada envio para a main,
# manualmente (aba Actions > "Run workflow") e ao final de cada recalibração dos modelos.
#
# Cadências do NEXUS (cada uma no seu workflow):
#   * diária   -> este arquivo: coleta, previsão de hoje e publicação
#   * semanal  -> recalibrar-modelos.yml: backtest do câmbio
#   * mensal   -> recalibrar-modelos.yml: backtest do IPCA e do SARIMA, depois da divulgação do IBGE
#
# Banco: PostgreSQL gerenciado (Neon), conexão no segredo DATABASE_URL.

name: Atualizar dashboard

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22h UTC = 19h em Brasília
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. A coleta usa uma trava no próprio banco (pg_advisory_lock),
# então esta atualização pode rodar junto com a recalibração sem conflito.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Testes Python (coleta, backtest, SARIMA, calibração)
        run: python -m pytest -q

      - name: Testes SQL (versões e datas de divulgação)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nexus_teste -v ON_ERROR_STOP=1 -f sql/forecast_schema.sql -f tests/sql/test_versoes.sql

  atualizar:
    name: Atualizar e publicar
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Conferir o segredo do banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Segredo DATABASE_URL não configurado (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Criar tabelas
        run: |
          python -c "import psycopg, os, pathlib; c = psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); c.execute(pathlib.Path('sql/schema.sql').read_text(encoding='utf-8'))"

      - name: Extrair dados do Banco Central
        run: python src/extract.py --inicio 01/01/2023

      - name: Carregar no PostgreSQL
        run: python src/load.py

      # O Forecast não derruba o dashboard: se falhar, o site sai com a última previsão publicada
      - name: Coletar dados do Forecast (PTAX, IBGE, IPCA, Focus)
        id: coleta
        continue-on-error: true
        run: python src/coletar_forecast.py

      - name: Gerar as previsões de hoje
        id: previsao
        continue-on-error: true
        run: python src/prever_atual.py

      - name: Gerar versão estática
        run: python src/build_static.py

      - name: Avisos
        if: always()
        run: |
          if [ "${{ steps.coleta.outcome }}" = "failure" ]; then
            echo "::warning::Coleta do Forecast falhou: veja o passo 'Coletar dados do Forecast'"
          fi
          if [ "${{ steps.previsao.outcome }}" = "failure" ]; then
            echo "::warning::Previsões não atualizadas (sem backtest no banco ou erro no modelo); o site mantém a última publicada"
          fi
          tail -20 logs/extract.log 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
